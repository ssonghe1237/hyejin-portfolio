server:
  port: 8081

spring:
  application:
    name: portfolio-backend

  profiles:
    active: local

  config:
    import: optional:classpath:application-local.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  upload:
    image-directory: ${IMAGE_UPLOAD_DIR:./uploads/projects}
    image-url-prefix: ${IMAGE_URL_PREFIX:/uploads/projects}
    max-image-size: 10485760

