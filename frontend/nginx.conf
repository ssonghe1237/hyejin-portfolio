# ============================================================
# Portfolio Frontend Nginx
#
# 역할
#
# /              → React
# /api/*         → Spring Boot
# /uploads/*     → Spring Boot
#
# 브라우저 입장에서는 모든 요청을
# 같은 도메인으로 보내게 된다.
# ============================================================

server {
    # Nginx Container 내부 HTTP Port
    listen 80;

    server_name _;

    # ---------------------------------------------------------
    # 업로드 요청 크기
    # ---------------------------------------------------------

    # Nginx 기본값은 작은 편이므로
    # 이미지/PDF 업로드가 막히지 않도록 설정
    #
    # Spring Boot도 현재 10MB 제한이 있으므로
    # 동일한 수준으로 맞춤
    client_max_body_size 12m;

    # ---------------------------------------------------------
    # React 정적 파일 위치
    # ---------------------------------------------------------

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------
    # Backend API Proxy
    # ---------------------------------------------------------

    # /api/... 요청은 React 파일을 찾는 것이 아니라
    # Spring Boot Backend로 전달합니다.
    #
    # backend라는 이름은 Docker Compose의
    # service 이릅입니다.
    location ^~ /api/ {

        # 예:
        #

        # Browser
        # GET /api/about
        #
        # ↓
        #
        # Nginx
        #
        # ↓
        #
        # http://backend:8081/api/about
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;

        # 실제 요청 정보를 header에 함께 실어 Backend에 전달 
        proxy_set_header Host $host;                # 사용자가 요청한 호스트(도메인) 정보
        proxy_set_header X-Real-IP $remote_addr;    # 실제 요청을 보낸 클라이언트 IP 주소
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Proxy를 여러 번 거치 경우에도 원본 클라이언트 IP를 추첮할수 있도록 IP 목록 형태로 전달
        proxy_set_header X-Forwarded-Proto $scheme; # 클라이언트가 접속할 때 사용한 최초 요청 프로토콜


        # -----------------------------------------------------
        # Backend Timeout
        # -----------------------------------------------------
        proxy_connect_timeout 5s;  # Backend 연결 자체를 기다리는 최대 시간
        proxy_read_timeout 60s;    # Backend 응답을 기다리는 최대 시간
    }


    # ---------------------------------------------------------
    # Upload Resource Proxy
    # ---------------------------------------------------------

    # DB에는 현재
    #
    # /uploads/projects/...
    # /uploads/resumes/...
    # /uploads/profile/...
    # /uploads/skills/...
    #
    # 형태가 저장되어 있다.
    #
    # 이 요청 역시 Spring Boot의 WebResourceConfig가
    # 처리하도록 Backend로 전달한다.
    location ^~ /uploads/ {

        # /uploads 요청 역시 Backend로 전달
        proxy_pass http://backend:8081;

        proxy_http_version 1.1;


        # 원래 요청 정보 전달
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------
    # React Router SPA 처리
    # ---------------------------------------------------------

    # 예:
    #
    # /
    # /work
    # /about
    # /research
    # /admin/projects
    #
    # 이런 URL은 실제 HTML 파일이 존재하지 않는다.
    #
    # 따라서 파일을 찾지 못하면 index.html을 반환하고
    # 이후 React Router가 URL을 해석한다.
    location / {
        # 1. $uri (실제 파일) 탐색
        # 2. $uri/ (실제 디렉토리) 탐색
        # 3. 없으면 /index.html 로 요청을 넘김
        try_files $uri $uri/ /index.html;
    }





}